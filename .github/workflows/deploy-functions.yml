name: Deploy Firebase Functions

# Deploys the Cloud Functions AND the Realtime Database rules. Runs when
# anything under functions/, database.rules.json, or reminder-messages.json
# (the reminder templates the functions bundle via firebase.json's predeploy
# hook) changes on the branch below, or on demand from the Actions tab
# ("Run workflow"). No local Firebase CLI needed — everything runs here.
#
# Removing a function from functions/index.js deletes it from the project on
# the next deploy (--force accepts the deletion non-interactively).

# Deploys run from main only — feature branches must merge before anything
# reaches production functions or rules (stale claude/* branches used to be
# able to deploy directly).
on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - "database.rules.json"
      - "reminder-messages.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        run: npm --prefix functions install

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy the functions and database rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key.json"
          # --force auto-accepts the Artifact Registry cleanup-policy prompt;
          # without it the CLI exits non-zero even after a successful deploy.
          # database publishes database.rules.json so rule changes go live with
          # the functions. firebase deploy runs firebase.json's functions
          # predeploy hook first, which copies reminder-messages.json into
          # functions/ before the source is packaged.
          firebase deploy --only functions,database --project tabs-4a0eb --force --non-interactive
          rm -f "$RUNNER_TEMP/sa-key.json"
